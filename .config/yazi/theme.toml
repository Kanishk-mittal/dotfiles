# Wallust Yazi Theme Template (Updated for Yazi v26.5.6)

# ==============================================================================
# Global App Styling
# ==============================================================================
[app]
# The app's overall style, supporting terminal background colors if OSC 11 is supported
overall = { bg = "#1A1717" }

# ==============================================================================
# Manager Pane Layout Styling
# ==============================================================================
[mgr]
cwd = { fg = "#AE8D28", italic = true }

# Visual Selections & Finds
find_keyword = { fg = "#968149", bg = "#1A1717", bold = true, underline = true }
find_position = { fg = "#AE8D28", bg = "#1A1717", bold = true }

# Symbolic Links
symlink_target = { fg = "#AE8D28" }

# Markers
marker_copied = { fg = "#968149", bg = "#968149" }
marker_cut = { fg = "#76674C", bg = "#76674C" }
marker_marked = { fg = "#89774F", bg = "#89774F" }
marker_selected = { fg = "#9B7F2F", bg = "#9B7F2F" }

# Counts
count_copied = { fg = "#1A1717", bg = "#968149" }
count_cut = { fg = "#1A1717", bg = "#76674C" }
count_selected = { fg = "#1A1717", bg = "#9B7F2F" }

# Border Accents
border_symbol = "│"
border_style = { fg = "#A59566" }

# ==============================================================================
# Indicator Bars (Pane Borders)
# ==============================================================================
[indicator]
parent = { fg = "#A59566" }
current = { fg = "#9B7F2F" }
preview = { fg = "#A59566" }
padding = { open = "", close = "" }

# ==============================================================================
# Top Navigation Tabs
# ==============================================================================
[tabs]
active = { fg = "#89774F", bg = "#1A1717", bold = true }
inactive = { fg = "#EBD592", bg = "#1A1717" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# ==============================================================================
# Status Bar (Bottom Panel)
# ==============================================================================
[status]
overall = { bg = "#1A1717" }
separator_open = ""
separator_close = ""

# Permissions
perm_type = { fg = "#9B7F2F" }
perm_read = { fg = "#968149" }
perm_write = { fg = "#76674C" }
perm_exec = { fg = "#89774F" }
perm_sep = { fg = "#A59566" }

# Progress Bar
progress_label = { fg = "#F7E8B8", bold = true }
progress_normal = { fg = "#9B7F2F", bg = "#1A1717" }
progress_error = { fg = "#76674C", bg = "#1A1717" }

# ==============================================================================
# Modes (Status bar mode pills)
# ==============================================================================
[mode]
normal_main = { fg = "#1A1717", bg = "#9B7F2F", bold = true }
normal_alt = { fg = "#9B7F2F", bg = "#1A1717" }
select_main = { fg = "#1A1717", bg = "#968149", bold = true }
select_alt = { fg = "#968149", bg = "#1A1717" }
unset_main = { fg = "#1A1717", bg = "#76674C", bold = true }
unset_alt = { fg = "#76674C", bg = "#1A1717" }

# ==============================================================================
# Input & Popups
# ==============================================================================
[input]
border = { fg = "#AE8D28" }
title = { fg = "#AE8D28", bold = true }
value = { fg = "#F7E8B8" }
selected = { bg = "#A59566" }

[confirm]
border = { fg = "#9B7F2F" }
title = { fg = "#9B7F2F", bold = true }
body = { fg = "#F7E8B8" }
list = { fg = "#AE8D28" }
btn_yes = { fg = "#1A1717", bg = "#89774F" }
btn_no = { fg = "#F7E8B8", bg = "#1A1717" }
btn_labels = ["  [Y]es  ", "  (N)o  "]

[notify]
title_info = { fg = "#89774F" }
title_warn = { fg = "#968149" }
title_error = { fg = "#76674C" }

# ==============================================================================
# Menus, Pickers, & Which-Key
# ==============================================================================
[pick]
border = { fg = "#9B7F2F" }
active = { fg = "#89774F", bold = true }
inactive = { fg = "#F7E8B8" }

[cmp] # Completions
border = { fg = "#AE8D28" }
active = { fg = "#1A1717", bg = "#AE8D28", bold = true }
inactive = { fg = "#F7E8B8" }
icon_file = "📄"
icon_folder = "📁"
icon_command = "🚀"

[spot] # Spotter Menu
border = { fg = "#9B7F2F" }
title = { fg = "#9B7F2F", bold = true }
tbl_col = { fg = "#89774F" }
tbl_cell = { fg = "#1A1717", bg = "#9B7F2F" }

[which]
cols = 3
mask = { bg = "#1A1717" }
cand = { fg = "#AE8D28" }
rest = { fg = "#A59566" }
desc = { fg = "#AE8D28" }
separator = " ➜ "
separator_style = { fg = "#A59566" }

[tasks]
border = { fg = "#9B7F2F" }
title = { fg = "#9B7F2F", bold = true }
hovered = { fg = "#89774F", bold = true }

[help]
on = { fg = "#AE8D28" }
run = { fg = "#AE8D28" }
desc = { fg = "#F7E8B8" }
hovered = { bg = "#A59566", bold = true }
footer = { fg = "#1A1717", bg = "#F7E8B8" }
icon_info = "ℹ️"
icon_warn = "⚠️"
icon_error = "❌"

# ==============================================================================
# Dynamic Folder & Icon Styling
# ==============================================================================
[icon]
prepend_dirs = [
    { name = "Desktop", text = "", fg = "#9B7F2F" },
    { name = "Documents", text = "", fg = "#9B7F2F" },
    { name = "Downloads", text = "", fg = "#9B7F2F" },
    { name = "Music", text = "", fg = "#9B7F2F" },
    { name = "Pictures", text = "", fg = "#9B7F2F" },
    { name = "Videos", text = "", fg = "#9B7F2F" },
]

prepend_conds = [
    # Global catch-all condition: if it is a directory, color it Wallust green
    { if = "dir", text = "", fg = "#9B7F2F" },
]

# Comprehensive File Type Color Overrides
[filetype]
rules = [
    # Directories / Folders
    { mime = "inode/directory", fg = "#9B7F2F", bold = true },

    # Text & Source Code files
    { mime = "text/*", fg = "#F7E8B8" },
    { mime = "application/{json,xml,toml,yaml,javascript}", fg = "#AE8D28" },

    # Executables and Scripts
    { mime = "application/x-executable", fg = "#89774F", bold = true },
    { mime = "application/x-shellscript", fg = "#89774F" },

    # Rich Documents
    { mime = "application/pdf", fg = "#76674C" },
    { mime = "application/msword", fg = "#9B7F2F" },

    # Images & Media
    { mime = "image/*", fg = "#AE8D28" },
    { mime = "image/svg+xml", fg = "#E8BC35" },
    { mime = "video/*", fg = "#76674C" },
    { mime = "audio/*", fg = "#968149" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive}", fg = "#A8852A" },

    # Fallback/Orphans
    { url = "*", is = "orphan", fg = "#76674C" },
    { url = "*", fg = "#F7E8B8" },
]
