font_family      Jetbrains Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 14.0

cursor_shape block
cursor_beam_thickness 1.5

confirm_os_window_close 0

tab_bar_edge bottom
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0
tab_bar_style slant
tab_bar_align left

background_opacity 0.8
background_blur 5

cursor_trail 3


window_padding_width 0 10
placement_strategy center
map ctrl+shift+enter launch --type=os-window --cwd=current

include ./colors.conf
