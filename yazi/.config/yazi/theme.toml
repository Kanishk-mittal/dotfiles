# Wallust Yazi Theme Template (Updated for Yazi v26.5.6)

# ==============================================================================
# Global App Styling
# ==============================================================================
[app]
# The app's overall style, supporting terminal background colors if OSC 11 is supported
overall = { bg = "#2A2924" }

# ==============================================================================
# Manager Pane Layout Styling
# ==============================================================================
[mgr]
cwd = { fg = "#BEB304", italic = true }

# Visual Selections & Finds
find_keyword = { fg = "#6F8949", bg = "#2A2924", bold = true, underline = true }
find_position = { fg = "#A4977F", bg = "#2A2924", bold = true }

# Symbolic Links
symlink_target = { fg = "#BEB304" }

# Markers
marker_copied = { fg = "#6F8949", bg = "#6F8949" }
marker_cut = { fg = "#4B704B", bg = "#4B704B" }
marker_marked = { fg = "#907841", bg = "#907841" }
marker_selected = { fg = "#AE9126", bg = "#AE9126" }

# Counts
count_copied = { fg = "#2A2924", bg = "#6F8949" }
count_cut = { fg = "#2A2924", bg = "#4B704B" }
count_selected = { fg = "#2A2924", bg = "#AE9126" }

# Border Accents
border_symbol = "│"
border_style = { fg = "#ACA755" }

# ==============================================================================
# Indicator Bars (Pane Borders)
# ==============================================================================
[indicator]
parent = { fg = "#ACA755" }
current = { fg = "#AE9126" }
preview = { fg = "#ACA755" }
padding = { open = "", close = "" }

# ==============================================================================
# Top Navigation Tabs
# ==============================================================================
[tabs]
active = { fg = "#907841", bg = "#2A2924", bold = true }
inactive = { fg = "#F6EE79", bg = "#2A2924" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# ==============================================================================
# Status Bar (Bottom Panel)
# ==============================================================================
[status]
overall = { bg = "#2A2924" }
separator_open = ""
separator_close = ""

# Permissions
perm_type = { fg = "#AE9126" }
perm_read = { fg = "#6F8949" }
perm_write = { fg = "#4B704B" }
perm_exec = { fg = "#907841" }
perm_sep = { fg = "#ACA755" }

# Progress Bar
progress_label = { fg = "#FFF9A7", bold = true }
progress_normal = { fg = "#AE9126", bg = "#2A2924" }
progress_error = { fg = "#4B704B", bg = "#2A2924" }

# ==============================================================================
# Modes (Status bar mode pills)
# ==============================================================================
[mode]
normal_main = { fg = "#2A2924", bg = "#AE9126", bold = true }
normal_alt = { fg = "#AE9126", bg = "#2A2924" }
select_main = { fg = "#2A2924", bg = "#6F8949", bold = true }
select_alt = { fg = "#6F8949", bg = "#2A2924" }
unset_main = { fg = "#2A2924", bg = "#4B704B", bold = true }
unset_alt = { fg = "#4B704B", bg = "#2A2924" }

# ==============================================================================
# Input & Popups
# ==============================================================================
[input]
border = { fg = "#A4977F" }
title = { fg = "#A4977F", bold = true }
value = { fg = "#FFF9A7" }
selected = { bg = "#ACA755" }

[confirm]
border = { fg = "#AE9126" }
title = { fg = "#AE9126", bold = true }
body = { fg = "#FFF9A7" }
list = { fg = "#A4977F" }
btn_yes = { fg = "#2A2924", bg = "#907841" }
btn_no = { fg = "#FFF9A7", bg = "#2A2924" }
btn_labels = ["  [Y]es  ", "  (N)o  "]

[notify]
title_info = { fg = "#907841" }
title_warn = { fg = "#6F8949" }
title_error = { fg = "#4B704B" }

# ==============================================================================
# Menus, Pickers, & Which-Key
# ==============================================================================
[pick]
border = { fg = "#AE9126" }
active = { fg = "#907841", bold = true }
inactive = { fg = "#FFF9A7" }

[cmp] # Completions
border = { fg = "#BEB304" }
active = { fg = "#2A2924", bg = "#BEB304", bold = true }
inactive = { fg = "#FFF9A7" }
icon_file = "📄"
icon_folder = "📁"
icon_command = "🚀"

[spot] # Spotter Menu
border = { fg = "#AE9126" }
title = { fg = "#AE9126", bold = true }
tbl_col = { fg = "#907841" }
tbl_cell = { fg = "#2A2924", bg = "#AE9126" }

[which]
cols = 3
mask = { bg = "#2A2924" }
cand = { fg = "#BEB304" }
rest = { fg = "#ACA755" }
desc = { fg = "#A4977F" }
separator = " ➜ "
separator_style = { fg = "#ACA755" }

[tasks]
border = { fg = "#AE9126" }
title = { fg = "#AE9126", bold = true }
hovered = { fg = "#907841", bold = true }

[help]
on = { fg = "#BEB304" }
run = { fg = "#A4977F" }
desc = { fg = "#FFF9A7" }
hovered = { bg = "#ACA755", bold = true }
footer = { fg = "#2A2924", bg = "#FFF9A7" }
icon_info = "ℹ️"
icon_warn = "⚠️"
icon_error = "❌"

# ==============================================================================
# Dynamic Folder & Icon Styling
# ==============================================================================
[icon]
prepend_dirs = [
    { name = "Desktop", text = "", fg = "#AE9126" },
    { name = "Documents", text = "", fg = "#AE9126" },
    { name = "Downloads", text = "", fg = "#AE9126" },
    { name = "Music", text = "", fg = "#AE9126" },
    { name = "Pictures", text = "", fg = "#AE9126" },
    { name = "Videos", text = "", fg = "#AE9126" },
]

prepend_conds = [
    # Global catch-all condition: if it is a directory, color it Wallust green
    { if = "dir", text = "", fg = "#AE9126" },
]

# Comprehensive File Type Color Overrides
[filetype]
rules = [
    # Directories / Folders
    { mime = "inode/directory", fg = "#AE9126", bold = true },

    # Text & Source Code files
    { mime = "text/*", fg = "#FFF9A7" },
    { mime = "application/{json,xml,toml,yaml,javascript}", fg = "#BEB304" },

    # Executables and Scripts
    { mime = "application/x-executable", fg = "#907841", bold = true },
    { mime = "application/x-shellscript", fg = "#907841" },

    # Rich Documents
    { mime = "application/pdf", fg = "#4B704B" },
    { mime = "application/msword", fg = "#AE9126" },

    # Images & Media
    { mime = "image/*", fg = "#A4977F" },
    { mime = "image/svg+xml", fg = "#DBC9A9" },
    { mime = "video/*", fg = "#4B704B" },
    { mime = "audio/*", fg = "#6F8949" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive}", fg = "#7A9E45" },

    # Fallback/Orphans
    { url = "*", is = "orphan", fg = "#4B704B" },
    { url = "*", fg = "#FFF9A7" },
]
